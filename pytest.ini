[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    postgres: needs a real PostgreSQL database (set TEST_POSTGRES_URL; the DB name must contain 'test')
