{% extends "base.html" %}

{% block content %}
<div class="login-container">
    <div class="login-box">
        <h1>Register</h1>
        <form method="POST" action="{{ url_for('auth.register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" minlength="8" maxlength="128" required>
            </div>
            {% if captcha_challenge %}
            <div class="form-group">
                <altcha-widget challengejson='{{ captcha_challenge|tojson }}'></altcha-widget>
            </div>
            {% endif %}
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
        <div class="login-links">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
{% if captcha_challenge %}
<script defer src="{{ url_for('static', filename='vendor/altcha/altcha.min.js') }}"></script>
{% endif %}
{% endblock %}
