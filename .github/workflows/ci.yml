name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Least privilege: the jobs below only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests with pytest
        run: |
          pytest -vv --tb=long --cov=app

  # Real PostgreSQL (same major version as dev): the migrations must upgrade,
  # check clean, downgrade to base and upgrade again, and the `postgres`-marked
  # tests (baseline equals the dev snapshot, USING cast, FK repoint, backup of
  # the legacy tables) must pass. The throw-away database name contains "test"
  # because the tests refuse to touch any other database.
  migrations-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rb
          POSTGRES_PASSWORD: rb
          POSTGRES_DB: riftbound_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rb -d riftbound_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # The URL lives in the command, not in an env block (CI-1): no application
      # secret is ever configured for the workflow. RB_ENV=development gives the
      # process a random SECRET_KEY, so none is needed either.
      - name: Migrations round trip (upgrade, check, downgrade to base, upgrade)
        run: |
          set -euo pipefail
          export RB_ENV=development
          export DATABASE_URL='postgresql+psycopg://rb:rb@localhost:5432/riftbound_test'
          flask db upgrade
          flask db check
          flask db downgrade base
          flask db upgrade
      - name: PostgreSQL tests
        run: |
          TEST_POSTGRES_URL='postgresql+psycopg://rb:rb@localhost:5432/riftbound_test' pytest -m postgres
