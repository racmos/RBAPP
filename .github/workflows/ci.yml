name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the jobs below only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # The suite configures itself (RB_ENV=testing, in-memory SQLite): no
      # application secret is passed to this job (CI-1).
      - name: Run tests with pytest
        run: |
          pytest -vv --tb=long --cov=app --cov-report=term --cov-report=xml
      - name: Upload the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # Real PostgreSQL (same major version as dev): the migrations must upgrade,
  # check clean, downgrade to base and upgrade again, and the `postgres`-marked
  # tests (baseline equals the dev snapshot, USING cast, FK repoint, backup of
  # the legacy tables) must pass. The throw-away database name contains "test"
  # because the tests refuse to touch any other database.
  migrations-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rb
          POSTGRES_PASSWORD: rb
          POSTGRES_DB: riftbound_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rb -d riftbound_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # The URL lives in the command, not in an env block (CI-1): no application
      # secret is ever configured for the workflow. RB_ENV=development gives the
      # process a random SECRET_KEY, so none is needed either.
      - name: Migrations round trip (upgrade, check, downgrade to base, upgrade)
        run: |
          set -euo pipefail
          export RB_ENV=development
          export DATABASE_URL='postgresql+psycopg://rb:rb@localhost:5432/riftbound_test'
          flask db upgrade
          flask db check
          flask db downgrade base
          flask db upgrade
      - name: PostgreSQL tests
        run: |
          TEST_POSTGRES_URL='postgresql+psycopg://rb:rb@localhost:5432/riftbound_test' pytest -m postgres

  # Placeholder for the React app (F1). While `frontend/package.json` does not
  # exist every Node step is skipped and the job passes. `hashFiles` is not
  # allowed in a job-level `if`, so each step carries the guard (CI-5).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        if: ${{ hashFiles('frontend/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: npm ci
      - name: Lint
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: npm run lint
      - name: Typecheck
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: npm run typecheck
      - name: Unit tests
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: npx vitest run
      - name: Build
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: npm run build
