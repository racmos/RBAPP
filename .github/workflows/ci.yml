name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the jobs below only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # The suite configures itself (RB_ENV=testing, in-memory SQLite): no
      # application secret is passed to this job (CI-1).
      - name: Run tests with pytest
        run: |
          pytest -vv --tb=long --cov=app --cov-report=term --cov-report=xml
      - name: Upload the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # Real PostgreSQL (same major version as dev): the migrations must upgrade,
  # check clean, downgrade to base and upgrade again. The `postgres`-marked
  # tests were removed by M-a (2026-10-22); a unit that adds new ones re-adds a
  # `pytest -m postgres` step here (with no marked test it would exit with 5).
  # The throw-away database name contains "test" because the tests refuse to
  # touch any other database.
  migrations-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rb
          POSTGRES_PASSWORD: rb
          POSTGRES_DB: riftbound_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rb -d riftbound_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # The URL lives in the command, not in an env block (CI-1): no application
      # secret is ever configured for the workflow. RB_ENV=development gives the
      # process a random SECRET_KEY, so none is needed either.
      - name: Migrations round trip (upgrade, check, downgrade to base, upgrade)
        run: |
          set -euo pipefail
          export RB_ENV=development
          export DATABASE_URL='postgresql+psycopg://rb:rb@localhost:5432/riftbound_test'
          flask db upgrade
          flask db check
          flask db downgrade base
          flask db upgrade

  # The React app (F1). Every step runs: `frontend/package.json` exists (CI-5).
  # The dist is uploaded for the deploy step; it needs no write permission.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
      # Manifest, icons, service worker and altcha chunking of the real build (CI-5, PWA-1..3).
      - name: Check the build output
        run: npm run check:dist
      # The rollback worker (PWA-5) is built on every run, into a folder that is not uploaded, so
      # the procedure in docs/frontend.md cannot rot unnoticed.
      - name: Build the self-destroying service worker
        env:
          VITE_PWA_SELF_DESTROY: 'true'
        run: npx vite build --outDir "$RUNNER_TEMP/self-destroy-dist" --emptyOutDir
      - name: Check the self-destroying service worker
        run: node scripts/check-dist.mjs --self-destroy "$RUNNER_TEMP/self-destroy-dist"
      - name: Upload the build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
